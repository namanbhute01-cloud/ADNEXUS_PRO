<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaart-E Display</title>
  <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }
    #media-container {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    video, img {
      max-width: 100%; max-height: 100%;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #logo-screen {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      background: #0a0a0a;
    }
    #logo-screen img { max-width: 300px; object-fit: contain; }
    #status {
      position: fixed; bottom: 8px; right: 8px;
      font-size: 11px; color: rgba(255,255,255,0.3);
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="media-container">
    <div id="logo-screen">
      <img src="/logo.png" alt="Vaart-E" />
    </div>
  </div>
  <div id="status">Connecting...</div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const SERIAL = params.get('serial')
    const SUB_SERIAL = params.get('sub')
    const API_BASE = params.get('api') || window.location.origin
    const PUSHER_KEY = '__PUSHER_KEY__'
    const PUSHER_CLUSTER = '__PUSHER_CLUSTER__'

    let playlist = []
    let playlistSignature = ''
    let currentIndex = 0
    let ambientEl = null
    let primaryEl = null
    let primaryTimer = null
    let currentPlaybackToken = 0

    const container = document.getElementById('media-container')
    const statusEl = document.getElementById('status')

    async function fetchContent() {
      try {
        const res = await fetch(`${API_BASE}/api/display/content`, {
          headers: {
            'X-Serial': SERIAL,
            'X-SubSerial': SUB_SERIAL,
          }
        })
        if (!res.ok) { showLogo(); return }
        const data = await res.json()
        if (data.playlist && data.playlist.length > 0) {
          loadPlaylist(data.playlist)
        } else {
          showLogo()
        }
      } catch (e) {
        showLogo()
      }
    }

    const pusher = new Pusher(PUSHER_KEY, { cluster: PUSHER_CLUSTER })
    const channel = pusher.subscribe(`tv-${SERIAL}-${SUB_SERIAL}`)

    channel.bind('content-update', (data) => {
      statusEl.textContent = 'Content updated'
      loadPlaylist(data.playlist)
    })

    channel.bind('clear-content', () => {
      playlist = []
      showLogo()
    })

    pusher.connection.bind('connected', () => statusEl.textContent = `Online · ${SUB_SERIAL}`)
    pusher.connection.bind('disconnected', () => statusEl.textContent = 'Reconnecting...')

    function sortByOrder(items) {
      return [...items].sort((a, b) => a.order - b.order)
    }

    function buildSignature(items) {
      return items
        .map((item) => [
          item.id,
          item.url,
          item.order,
          item.duration ?? '',
          item.playbackLayer,
          item.volumePercent ?? '',
          item.duckAmbient ? '1' : '0',
          item.loopPlayback ? '1' : '0',
          item.originalName ?? '',
        ].join(':'))
        .join('|')
    }

    function getAmbientItem() {
      return sortByOrder(playlist).find((item) => item.playbackLayer === 'AMBIENT') || null
    }

    function getPrimaryItems() {
      return sortByOrder(playlist).filter((item) => item.playbackLayer !== 'AMBIENT')
    }

    function loadPlaylist(items) {
      const nextPlaylist = sortByOrder(items)
      const nextSignature = buildSignature(nextPlaylist)
      const playlistChanged = nextSignature !== playlistSignature
      const activePrimaryId = primaryEl?.dataset?.mediaId || ''

      playlist = nextPlaylist
      playlistSignature = nextSignature

      renderAmbient()

      if (!playlistChanged) {
        return
      }

      const primaryItems = getPrimaryItems()
      if (!primaryItems.length) {
        showLogo()
        return
      }

      const matchedIndex = activePrimaryId
        ? primaryItems.findIndex((item) => item.id === activePrimaryId)
        : -1
      currentIndex = matchedIndex >= 0 ? matchedIndex : 0
      playNext()
    }

    function playNext() {
      const primaryItems = getPrimaryItems()
      if (!primaryItems.length) { showLogo(); return }
      const item = primaryItems[currentIndex % primaryItems.length]
      currentIndex++
      playItem(item)
    }

    function clearPrimaryTimer() {
      if (primaryTimer) {
        clearTimeout(primaryTimer)
        primaryTimer = null
      }
    }

    function setAmbientVolume(ducked) {
      const ambientItem = getAmbientItem()
      if (!ambientEl || !ambientItem) return
      const base = Math.max(0, Math.min(1, (ambientItem.volumePercent ?? 100) / 100))
      ambientEl.volume = ducked ? base * 0.2 : base
    }

    function configureMedia(el, volume, { isVideo = false, loop = false } = {}) {
      el.autoplay = true
      el.loop = loop
      el.preload = 'auto'
      el.crossOrigin = 'anonymous'
      el.volume = Math.max(0, Math.min(1, volume))
      el.muted = false
      if (isVideo) {
        el.playsInline = true
        el.setAttribute('playsinline', '')
        el.setAttribute('webkit-playsinline', 'true')
      }
      return el
    }

    function renderAmbient() {
      if (ambientEl) {
        ambientEl.remove()
        ambientEl = null
      }

      const ambientItem = getAmbientItem()
      if (!ambientItem) return

      if (ambientItem.type === 'VIDEO') {
        const video = document.createElement('video')
        video.src = ambientItem.url
        configureMedia(video, (ambientItem.volumePercent ?? 100) / 100, { isVideo: true, loop: true })
        video.style.position = 'fixed'
        video.style.inset = '0'
        video.style.width = '100%'
        video.style.height = '100%'
        video.style.objectFit = 'cover'
        video.style.opacity = '0.35'
        video.style.zIndex = '0'
        document.body.appendChild(video)
        ambientEl = video
        tryPlay(video, { kind: 'ambient', allowMutedFallback: true })
        return
      }

      if (ambientItem.type === 'AUDIO') {
        const audio = document.createElement('audio')
        audio.src = ambientItem.url
        configureMedia(audio, (ambientItem.volumePercent ?? 100) / 100, { loop: true })
        document.body.appendChild(audio)
        ambientEl = audio
        tryPlay(audio, { kind: 'ambient', allowMutedFallback: true })
      }
    }

    async function tryPlay(el, { kind = 'primary', allowMutedFallback = true } = {}) {
      if (!el) return false
      try {
        await el.play()
        statusEl.textContent = `Online · ${SUB_SERIAL}`
        return true
      } catch (e) {
        if (allowMutedFallback) {
          try {
            el.muted = true
            await el.play()
            return false
          } catch (_) {}
        }
        statusEl.textContent = `${kind === 'ambient' ? 'Ambient' : 'Primary'} playback degraded`
        return false
      }
    }

    function playItem(item) {
      clearPrimaryTimer()
      currentPlaybackToken += 1
      const playbackToken = currentPlaybackToken
      const advanceIfCurrent = () => {
        if (playbackToken !== currentPlaybackToken) return
        setAmbientVolume(false)
        playNext()
      }
      container.innerHTML = ''
      primaryEl = null
      const shouldDuck = item.duckAmbient && (item.type === 'VIDEO' || item.type === 'AUDIO')
      setAmbientVolume(shouldDuck)
      if (item.type === 'VIDEO') {
        const v = document.createElement('video')
        v.src = item.url
        v.dataset.mediaId = item.id
        configureMedia(v, (item.volumePercent ?? 100) / 100, { isVideo: true, loop: false })
        v.onended = advanceIfCurrent
        v.onerror = advanceIfCurrent
        container.appendChild(v)
        primaryEl = v
        tryPlay(v, { kind: 'primary', allowMutedFallback: true })
      } else if (item.type === 'AUDIO') {
        const a = document.createElement('audio')
        a.src = item.url
        a.dataset.mediaId = item.id
        configureMedia(a, (item.volumePercent ?? 100) / 100, { loop: false })
        a.onended = advanceIfCurrent
        a.onerror = advanceIfCurrent
        container.appendChild(a)
        primaryEl = a
        tryPlay(a, { kind: 'primary', allowMutedFallback: true })
      } else {
        const img = document.createElement('img')
        img.src = item.url
        img.alt = ''
        img.dataset.mediaId = item.id
        img.onerror = advanceIfCurrent
        container.appendChild(img)
        const durationMs = Math.max(1, item.duration || 10) * 1000
        primaryTimer = setTimeout(() => {
          if (playbackToken !== currentPlaybackToken) return
          setAmbientVolume(false)
          playNext()
        }, durationMs)
      }
    }

    function showLogo() {
      clearPrimaryTimer()
      primaryEl = null
      container.innerHTML = `<div id="logo-screen"><img src="/logo.png" alt="Vaart-E" /></div>`
      setAmbientVolume(false)
    }

    function sendHeartbeat() {
      fetch(`${API_BASE}/api/display/heartbeat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Serial': SERIAL, 'X-SubSerial': SUB_SERIAL },
        body: JSON.stringify({ timestamp: Date.now() })
      }).catch(() => {})
    }

    fetchContent()
    sendHeartbeat()
    setInterval(sendHeartbeat, 60 * 1000)
    setTimeout(() => location.reload(), 6 * 60 * 60 * 1000)
  </script>
</body>
</html>
