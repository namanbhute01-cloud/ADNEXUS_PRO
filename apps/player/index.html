<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdNexus Edge Controller v2</title>
    <style>
        :root {
            --bg-primary: #0a0b10;
            --bg-surface: #121420;
            --accent-glow: #00ffcc;
            --accent-warn: #ff3366;
            --text-main: #f0f4f8;
            --text-muted: #64748b;
            --font-stack: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            margin: 0;
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-stack);
            overflow: hidden;
            height: 100vh;
        }

        .dashboard-layout {
            display: grid;
            grid-template-rows: 70px 1fr;
            height: 100vh;
        }

        header {
            background-color: var(--bg-surface);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .brand {
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 204, 0.05);
            border: 1px solid var(--accent-glow);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="dashboard-layout">
        <header>
            <div class="brand">AdNexus // Pro</div>
            <div id="connection-status" class="status-pill">System Synchronized</div>
        </header>

        <!-- Custom high-performance Web Component UI Elements -->
        <adn-display-monitor id="primary-monitor"></adn-display-monitor>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module">
        // Registering encapsulated display monitor component
        class AdnDisplayMonitor extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = `
                    <style>
                        :host {
                            display: block;
                            padding: 24px;
                            position: relative;
                        }
                        .canvas-wrapper {
                            background: var(--bg-surface);
                            border-radius: 12px;
                            position: relative;
                            width: 100%;
                            aspect-ratio: 16/9;
                            border: 1px solid rgba(255,255,255,0.03);
                            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
                            overflow: hidden;
                        }
                        .canvas-wrapper video, .canvas-wrapper img {
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                            display: block; /* Ensure media elements are block-level */
                        }
                        .telemetry-overlay {
                            position: absolute;
                            top: 16px;
                            left: 16px;
                            background: rgba(10, 11, 16, 0.85);
                            backdrop-filter: blur(8px);
                            padding: 12px;
                            border-radius: 8px;
                            font-family: monospace;
                            font-size: 11px;
                            border: 1px solid rgba(255,255,255,0.05);
                            color: var(--text-main);
                        }
                        .telemetry-overlay div {
                            margin-bottom: 4px;
                        }
                        .telemetry-overlay span {
                            color: var(--accent-glow);
                        }
                    </style>
                    <div class="canvas-wrapper" id="video-host-container">
                        <div class="telemetry-overlay">
                            <div>NODE_STATUS: <span id="node-status">ACTIVE</span></div>
                            <div>FPS: <span id="fps-counter">60</span></div>
                            <div>OFFSET: <span id="offset-counter">0ms</span></div>
                            <div>PLAYHEAD: <span id="playhead-counter">0.00s</span></div>
                        </div>
                    </div>
                `;
            }

            // Expose a method to update telemetry values from outside the Shadow DOM
            updateTelemetry(status, fps, offset, playhead) {
                if (this.shadowRoot) {
                    this.shadowRoot.getElementById('node-status').innerText = status;
                    this.shadowRoot.getElementById('fps-counter').innerText = fps;
                    this.shadowRoot.getElementById('offset-counter').innerText = offset;
                    this.shadowRoot.getElementById('playhead-counter').innerText = playhead;
                }
            }
        }
        customElements.define('adn-display-monitor', AdnDisplayMonitor);
    </script>
    <script type="module" src="./app.js"></script>
    <adn-developer-panel></adn-developer-panel>
</body>
</body>
</html>
